name: Release

# Every push to main builds a fresh Callsign, packs the Velopack installer + a delta, and publishes them as a
# GitHub Release -- so every installed copy auto-updates on its next launch. No secret to configure: the
# built-in GITHUB_TOKEN carries the release-write permission granted below. NOTE: the repo must be PUBLIC so
# the shipped app can download updates anonymously (GithubSource in Program.cs).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'web/**', '.gitignore', '.github/**']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # let the built-in GITHUB_TOKEN create GitHub Releases

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor   # let the vpk tool (older TFM) run on the net10 runtime
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Compute a monotonic version (0.MINOR.<run number>)
        id: ver
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content Directory.Build.props -Raw), '<Version>(\d+)\.(\d+)')
          $version = "$($m.Groups[1].Value).$($m.Groups[2].Value).${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Publish the app (self-contained folder)
        run: dotnet publish app/Callsign.Desktop/Callsign.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Pack + publish the release (Velopack -> GitHub Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          dotnet tool install --global vpk --version 0.0.1053
          # Pull the latest prior release so Velopack can build a small delta. First run finds none -- fine.
          vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases
          if ($LASTEXITCODE -ne 0) { Write-Host "No prior release to delta against (first run) -- continuing." }
          vpk pack --packId Callsign --packVersion $env:VER --packDir publish --mainExe Callsign.exe --packTitle Callsign --packAuthors Callsign --icon app/Callsign.Desktop/callsign.ico --splashImage app/Callsign.Desktop/splash.png --outputDir releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases --releaseName "Callsign $env:VER" --tag "v$env:VER" --merge --publish
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }
          Write-Host "Published v$env:VER to GitHub Releases -- installed copies update on next launch."
