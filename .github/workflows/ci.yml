name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  portable:
    name: Portable — build & test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet --info
      - name: Test SimConnect (portable)
        run: dotnet test -c Release tests/Callsign.SimConnect.Tests/Callsign.SimConnect.Tests.csproj
      - name: Test Core
        run: dotnet test -c Release tests/Callsign.Core.Tests/Callsign.Core.Tests.csproj
      - name: Test Host (API integration)
        run: dotnet test -c Release tests/Callsign.Host.Tests/Callsign.Host.Tests.csproj

  windows:
    name: Windows — full solution (stub SimConnect) + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # No SimConnect binaries in CI, so Callsign.SimConnect.Windows compiles as a stub.
      - name: Build solution
        run: dotnet build -c Release Callsign.slnx
      - name: Test
        run: |
          dotnet test -c Release --no-build tests/Callsign.SimConnect.Tests/Callsign.SimConnect.Tests.csproj
          dotnet test -c Release --no-build tests/Callsign.Core.Tests/Callsign.Core.Tests.csproj
          dotnet test -c Release --no-build tests/Callsign.Host.Tests/Callsign.Host.Tests.csproj
